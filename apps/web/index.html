<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Study Buddy</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="src/index.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    // Must match the envelope written by src/lib/storage.ts.
    (function () {
      try {
        var raw = localStorage.getItem("asb:v2:theme");
        var parsed = raw ? JSON.parse(raw) : null;
        if (parsed && parsed.data === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
